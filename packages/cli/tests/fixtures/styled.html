<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Styled Fixture</title>
    <style>
      body {
        margin: 0;
      }
      .card {
        color: #1a1a1a;
        background-color: #ffffff;
        padding: 16px;
      }
      .card p {
        color: #1a1a1a;
        font-size: 14px;
      }
      .highlight {
        color: #1a1a1a;
        background-color: #ffffff;
        padding: 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card"><p>First card.</p></div>
      <div class="highlight">
        <p style="color: #1a1a1a; font-size: 14px">
          Second block, repeated styling.
        </p>
      </div>
    </main>
  </body>
</html>
