<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Toggle Button Fixture</title>
  </head>
  <body>
    <main>
      <button
        id="reveal"
        onclick="
          document.getElementById('revealed').textContent =
            'Revealed by clicking the button.'
        "
      >
        Show More
      </button>
      <div id="revealed"></div>
    </main>
  </body>
</html>
