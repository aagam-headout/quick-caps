<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Gallery Fixture</title>
  </head>
  <body>
    <ul>
      <li>
        <img
          src="/img/1.jpg"
          loading="lazy"
          srcset="/img/1.jpg 1x, /img/1@2x.jpg 2x"
          alt="1"
        />
      </li>
      <li><img src="/img/2.jpg" loading="lazy" alt="2" /></li>
      <li>
        <picture>
          <source srcset="/img/3.avif" type="image/avif" />
          <img src="/img/3.jpg" alt="3" />
        </picture>
      </li>
    </ul>
  </body>
</html>
