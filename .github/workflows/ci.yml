name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # playwright is a dependency of quick-caps-cli, not of the workspace root,
      # so its bin only resolves inside that package.
      - run: pnpm --filter quick-caps-cli exec playwright install chromium
      - run: pnpm -w format:check
      - run: pnpm -w lint
      # Must run before typecheck: quick-caps-core's exports.types points at
      # ./dist/index.d.ts, which doesn't exist on a fresh checkout —
      # `pnpm -w typecheck` resolves quick-caps-core's types the same way any
      # TS consumer would, and fails without dist/ already built.
      - run: pnpm -w build:packages
      - run: pnpm -w typecheck
      - run: pnpm -w test -- --coverage
      - run: pnpm -w build
      # Reads dist/, so it has to follow the build.
      - run: pnpm exec vitest run apps/extension/tests/collector-bundle.test.ts apps/extension/tests/build-artifacts.test.ts

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # @playwright/test lives in the extension package, same reason.
      - run: pnpm --filter @quick-caps/extension exec playwright install --with-deps chromium
      # Chrome refuses to load an extension headlessly, so the run needs a
      # display even though nobody is watching it.
      - run: xvfb-run --auto-servernum pnpm -w e2e
